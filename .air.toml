# Air configuration for Zhulong
# Reference: https://github.com/air-verse/air

root = "."
tmp_dir = "build/air"

[build]
  # ⚠️ 后端选择必须在这里显式给出：Air 会独立调用 build.py，而每次调用都会重新 configure
  # CMake，未显式传后端时 CMake 直接失败（没有静默降级到桩的路径）。
  # 默认 onnx（Host 开发机真推理）；macOS 用 `brew install onnxruntime` 即可，前缀自动识别；
  # Linux 把官方 tarball 解到 build/deps/onnxruntime（或 export ZHULONG_ONNX_ROOT）。
  # 只想跑通前后端、不需要真推理时用 `ZHULONG_INFERENCE_BACKEND=test_stub make dev`。
  # 注意保持与 `make dev` / `make native-build` 的选择一致，否则两者会来回重编 native。
  cmd = "ZHULONG_INFERENCE_BACKEND=${ZHULONG_INFERENCE_BACKEND:-onnx} python3 native/scripts/build.py go build -o ./build/air/Zhulong ./cmd/Zhulong"
  bin = "./build/air/Zhulong"
  full_bin = "./build/air/Zhulong"
  include_ext = ["go", "toml"]
  exclude_dir = [
    "web",
    "native",
    "build",
    ".trellis",
    ".git",
    "internal/webui/dist",
  ]
  include_dir = ["cmd", "internal"]
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "1000ms"

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
