  /media/content/{path}:
    get:
      description: 'Streams the raw bytes of a media file with full RFC 7233 range
        support. The server performs byte transfer only: no decoding, demuxing, remuxing,
        transcoding or slicing. The successful response body is a raw byte stream,
        not the JSON envelope; error responses follow the standard envelope except
        for 416, which net/http writes as plain text.'
      parameters:
      - description: Media path relative to the media root
        in: path
        name: path
        required: true
        type: string
      - description: Byte range, e.g. bytes=0-1023
        in: header
        name: Range
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "206":
          description: Partial Content
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "416":
          description: Invalid range
          schema:
            type: string
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Stream media file bytes
      tags:
      - media
  /media/entries/{path}:
    get:
