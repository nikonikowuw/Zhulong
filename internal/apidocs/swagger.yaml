    get:
      parameters:
      - description: Page number (1-based, default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      - description: Filter by one action (legacy parameter)
        in: query
        name: action
        type: string
      - collectionFormat: multi
        description: Filter by any matching action (repeat parameter for multiple
          values)
        in: query
        items:
          type: string
        name: actions
        type: array
      - description: Filter by status (success/failed)
        in: query
        name: status
        type: string
      - description: Start time (RFC3339)
        in: query
        name: startTime
        type: string
      - description: End time (RFC3339)
        in: query
        name: endTime
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/httputil.PaginatedData-audithttp_AuditLogResponse'
              type: object
      summary: List audit logs with filtering and pagination
      tags:
      - audit
