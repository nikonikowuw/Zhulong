  algorithm.DeletionImpact:
    properties:
      affectedCameraIds:
        description: AffectedCameraIDs 列出受影响相机，供前端直接展示「这 3 台相机会停」。
        items:
          type: string
        type: array
      alarmCount:
        type: integer
      algorithmId:
        type: string
      algorithmName:
        type: string
      boundTaskCount:
        description: |-
          BoundTaskCount 是当前绑定了该算法的通道任务数。卸载后这些任务的该算法条目
          会被删除；任务本身保留（其他算法不受影响），但若某任务因此变成空任务，
          那台相机就完全停止分析了。
        type: integer
      captureCount:
        type: integer
      recognitionCount:
        description: |-
          RecognitionCount / AlarmCount / CaptureCount 是历史证据条数。
          卸载**不会删除**它们，只会让 algorithm_id 变成 NULL。
          前端文案必须准确：是「失去归属」而非「删除」。
        type: integer
      requiresStop:
        description: RequiresStop 表示算法当前正在运行，卸载会先强制停止它。
        type: boolean
      status:
        type: string
      version:
        type: string
    type: object
