info:
  contact: {}
  description: Local API for the Zhulong edge operations host.
  title: Zhulong API
  version: "1.0"
paths:
  /algorithms:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/algorithm.Algorithm'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: List registered algorithms
      tags:
      - algorithm
  /algorithms/{id}:
    delete:
      description: Removes the algorithm registration and its installed files. Deleting
        an algorithm that is currently ACTIVE returns 409 ALGORITHM_IS_ACTIVE; disable
        it first.
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  type: object
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Delete an algorithm
      tags:
      - algorithm
    get:
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.Algorithm'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get algorithm details by ID
      tags:
      - algorithm
  /algorithms/{id}/deletion-impact:
    get:
      description: 'Returns how many tasks, cameras and evidence records reference
        this algorithm. Read-only: it has no side effects and can be called freely
        before asking the operator to confirm. Note that deleting an algorithm does
        NOT delete evidence records — it only clears their algorithm reference, so
        `algorithmId` becomes empty while the `algorithmName` / `algorithmVersion`
        snapshots remain.'
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.DeletionImpact'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Preview the impact of deleting an algorithm
      tags:
      - algorithm
  /algorithms/{id}/disable:
    post:
      description: Stops the supervised runner subprocess and sets the algorithm status
        to DISABLED.
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  type: object
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Disable an algorithm and stop its runner process
      tags:
      - algorithm
  /algorithms/{id}/enable:
    post:
      description: Starts the supervised runner subprocess and sets the algorithm
        status to ACTIVE. The runner is monitored and restarted according to the recovery
        policy until the crash-loop threshold is reached.
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  type: object
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Enable an algorithm and start its runner process
      tags:
      - algorithm
  /algorithms/{id}/reset:
    post:
      description: Clears the crash-loop circuit breaker and returns the algorithm
        to DISABLED so it can be enabled again. Returns 409 ALGORITHM_NOT_IN_CRASH_LOOP
        when the algorithm is not currently in CRASH_LOOP.
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  type: object
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Reset an algorithm stuck in CRASH_LOOP
      tags:
      - algorithm
  /algorithms/install:
    post:
      consumes:
      - multipart/form-data
      description: Streams a multipart archive to a temporary file, then verifies
        platform target, resource budget, sample inference and config schema before
        registering the algorithm. Rejects platform mismatch, unsupported archive
        formats, zip-slip paths, decompression bombs, invalid manifest tokens and
        already installed versions.
      parameters:
      - description: Algorithm package archive (at most 500 MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.Algorithm'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Install an algorithm package
      tags:
      - algorithm
  /audit/logs:
    delete:
      parameters:
      - description: Clear logs older than this RFC3339 timestamp
        in: query
        name: before
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
