basePath: /api/v1
definitions:
  app.HealthData:
    properties:
      components:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
    type: object
  auth.AuthStatusResponse:
    properties:
      initialized:
        type: boolean
    type: object
  auth.InitAdminRequest:
    properties:
      confirmPassword:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - confirmPassword
    - password
    - username
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.UserResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  httputil.FieldDetail:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    required:
    - code
    - field
    - message
    type: object
  httputil.Response:
    properties:
      code:
        type: string
      data: {}
      details:
        items:
          $ref: '#/definitions/httputil.FieldDetail'
        type: array
      message:
        type: string
    required:
    - code
    - data
    - message
    type: object
info:
  contact: {}
  description: Local API for the Zhulong edge operations host.
  title: Zhulong API
  version: "1.0"
paths:
  /auth/init:
    post:
      consumes:
      - application/json
      parameters:
      - description: Admin credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.InitAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.Response'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Initialize administrator account
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Response'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httputil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Login as administrator
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Logout administrator session
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get currently authenticated user
      tags:
      - auth
  /auth/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthStatusResponse'
              type: object
      summary: Get system initialization status
      tags:
      - auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/app.HealthData'
              type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get host health
      tags:
      - system
swagger: "2.0"
