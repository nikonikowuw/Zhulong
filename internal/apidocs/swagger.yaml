      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/mediafile.MediaRootInfo'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get media root status
      tags:
      - media
  /media/signed/{path}:
    get:
      description: Streams snapshot bytes verified by HMAC signature without cookie
        authentication.
      parameters:
      - description: Relative media path, e.g. snapshots/cam_01/2026-11-03/01J8Z.jpg
        in: path
        name: path
        required: true
        type: string
      - description: Expiration Unix timestamp
        format: int64
        in: query
        name: exp
        required: true
        type: integer
      - description: Base64URL HMAC signature
        in: query
        name: sig
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
          schema:
            type: file
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Serve signed media content
      tags:
      - media
