basePath: /api/v1
definitions:
  app.HealthData:
    properties:
      components:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
    type: object
  audit.AuditLogDTO:
    properties:
      action:
        type: string
      createdAt:
        type: string
      detail:
        type: string
      errorMsg:
        type: string
      id:
        type: integer
      ip:
        type: string
      status:
        type: string
      target:
        type: string
      username:
        type: string
    type: object
  auth.AuthStatusResponse:
    properties:
      initialized:
        type: boolean
    type: object
  auth.InitAdminRequest:
    properties:
      confirmPassword:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - confirmPassword
    - password
    - username
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.UserResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  camera.CameraCredentialsResponse:
    properties:
      cameraId:
        type: string
      credentials:
        additionalProperties:
          type: string
        description: role -> full plaintext RTSP URL
        type: object
    type: object
  camera.CameraResponse:
    properties:
      createdAt:
        type: string
      degraded:
        type: boolean
      enabled:
        type: boolean
      health:
        type: string
      id:
        type: string
      lastCheckedAt:
        type: string
      lastSuccessAt:
        type: string
      name:
        type: string
      reason:
        type: string
      revision:
        type: integer
      session:
        type: string
      stale:
        type: boolean
      streams:
        items:
          $ref: '#/definitions/camera.StreamResponse'
        type: array
      updatedAt:
        type: string
    type: object
  camera.CameraStateInfo:
    properties:
      cameraId:
        type: string
      degraded:
        type: boolean
      enabled:
        type: boolean
      health:
        type: string
      lastCheckedAt:
        type: string
      lastSuccessAt:
        type: string
      reason:
        type: string
      revision:
        type: integer
      session:
        type: string
      stale:
        type: boolean
      streams:
        additionalProperties:
          $ref: '#/definitions/camera.StreamStateInfo'
        type: object
    type: object
  camera.CreateCameraRequest:
    properties:
      enabled:
        type: boolean
      id:
        type: string
      mainStream:
        $ref: '#/definitions/camera.CreateStreamRequest'
      name:
        maxLength: 64
        minLength: 1
        type: string
      subStream:
        $ref: '#/definitions/camera.CreateStreamRequest'
    required:
    - mainStream
    - name
    type: object
  camera.CreateStreamRequest:
    properties:
      protocol:
        description: '"rtsp" (default)'
        type: string
      role:
        description: '"main" or "sub"'
        type: string
      rtspUrl:
        type: string
      transport:
        description: '"tcp" or "udp" (default "tcp")'
        type: string
    required:
    - rtspUrl
    type: object
  camera.DiagnoseResponse:
    properties:
      cameraId:
        type: string
      message:
        type: string
      state:
        $ref: '#/definitions/camera.CameraStateInfo'
    type: object
  camera.StreamResponse:
    properties:
      codec:
        type: string
      createdAt:
        type: string
      fps:
        type: number
      fpsString:
        type: string
      height:
        type: integer
      id:
        type: integer
      protocol:
        type: string
      role:
        type: string
      rtspUrl:
        description: Complete RTSP URL for frontend playback and display
        type: string
      runtimeState:
        $ref: '#/definitions/camera.StreamStateInfo'
      transport:
        type: string
      updatedAt:
        type: string
      width:
        type: integer
    type: object
  camera.StreamStateInfo:
    properties:
      consecutiveFailures:
        type: integer
      errorMessage:
        type: string
      evidenceType:
        type: string
      health:
        type: string
      lastCheckedAt:
        type: string
      lastSuccessAt:
        type: string
      reason:
        type: string
      role:
        type: string
      session:
        type: string
    type: object
  camera.UpdateCameraRequest:
    properties:
      enabled:
        type: boolean
      mainStream:
        $ref: '#/definitions/camera.CreateStreamRequest'
      name:
        maxLength: 64
        minLength: 1
        type: string
      revision:
        type: integer
      subStream:
        $ref: '#/definitions/camera.CreateStreamRequest'
    required:
    - revision
    type: object
  httputil.FieldDetail:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    required:
    - code
    - field
    - message
    type: object
  httputil.PaginatedData-audit_AuditLogDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/audit.AuditLogDTO'
        type: array
      limit:
        description: Backwards compatibility fields for legacy clients expecting limit/offset
        type: integer
      offset:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  httputil.PaginatedData-camera_CameraResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/camera.CameraResponse'
        type: array
      limit:
        description: Backwards compatibility fields for legacy clients expecting limit/offset
        type: integer
      offset:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  httputil.Response:
    properties:
      code:
        type: string
      data: {}
      details:
        items:
          $ref: '#/definitions/httputil.FieldDetail'
        type: array
      message:
        type: string
    required:
    - code
    - data
    - message
    type: object
  network.ApplyResponse:
    properties:
      confirmToken:
        type: string
      targetUrl:
        type: string
      timeoutSec:
        type: integer
      transactionId:
        type: string
    type: object
  network.ConfirmRequest:
    properties:
      token:
        type: string
    type: object
  network.InterfaceConfig:
    properties:
      dns:
        description: DNS servers list
        items:
          type: string
        type: array
      gateway:
        description: Optional gateway address, e.g. "192.168.1.1"
        type: string
      ipAddress:
        description: Required when mode is "static", e.g. "192.168.1.100"
        type: string
      mode:
        enum:
        - dhcp
        - static
        type: string
      setDefault:
        description: Designate this interface as default gateway
        type: boolean
      subnetMask:
        description: Required when mode is "static", e.g. "255.255.255.0"
        type: string
    required:
    - mode
    type: object
  network.InterfaceInfo:
    properties:
      dns:
        description: Configured DNS servers
        items:
          type: string
        type: array
      gateway:
        description: Configured gateway address, or empty
        type: string
      ipAddresses:
        description: Assigned IPv4 addresses with CIDR prefix, e.g. ["192.168.1.100/24"]
        items:
          type: string
        type: array
      isCurrent:
        description: True only when the current HTTP request maps unambiguously to
          this interface
        type: boolean
      isDefaultGw:
        description: True if interface hosts default route (0.0.0.0/0)
        type: boolean
      linkUp:
        description: Carrier status (cable plugged in)
        type: boolean
      mac:
        description: Physical MAC address, e.g. "52:54:00:12:34:56"
        type: string
      mode:
        description: '"dhcp" or "static"'
        type: string
      name:
        description: Interface identifier, e.g. "eth0"
        type: string
    type: object
  network.PingRequest:
    properties:
      target:
        type: string
    required:
    - target
    type: object
  network.PingResponse:
    properties:
      reachable:
        type: boolean
      rttMs:
        type: number
    type: object
  network.RollbackRequest:
    properties:
      token:
        type: string
    type: object
  network.TransactionState:
    properties:
      confirmToken:
        type: string
      expiresAt:
        type: string
      interfaceName:
        type: string
      rollbackConfig:
        $ref: '#/definitions/network.InterfaceConfig'
      status:
        description: '"idle", "pending_confirm", "rolling_back"'
        type: string
      targetUrl:
        type: string
      timeoutSec:
        type: integer
      transactionId:
        type: string
    type: object
  storage.CleanupSummary:
    properties:
      deletedFiles:
        type: integer
      durationMs:
        type: integer
      finishedAt:
        type: string
      freedBytes:
        type: integer
      targetStatus:
        type: string
      triggerReason:
        description: '"watermark", "scheduled", "manual"'
        type: string
    type: object
  storage.PathTestRequest:
    properties:
      path:
        type: string
    required:
    - path
    type: object
  storage.PathTestResponse:
    properties:
      deviceId:
        type: integer
      errorReason:
        type: string
      exists:
        type: boolean
      freeBytes:
        type: integer
      fsType:
        type: string
      isExternal:
        type: boolean
      isMount:
        type: boolean
      mountPoint:
        type: string
      path:
        type: string
      totalBytes:
        type: integer
      writable:
        type: boolean
    type: object
  storage.StorageConfig:
    properties:
      emergencyStopMinMb:
        description: Emergency minimum free space in megabytes (100..102400)
        type: integer
      emergencyStopPercent:
        description: Emergency write-stop percentage (90..99)
        type: integer
      exportsRetentionHours:
        description: Exported clips retention in hours (1..168)
        type: integer
      highWatermarkPercent:
        description: High watermark percentage triggering cleaner (50..95)
        type: integer
      lowWatermarkPercent:
        description: Low watermark percentage where cleaner sleeps (40..85)
        type: integer
      mediaDirectory:
        description: Root media path, e.g. "/mnt/storage/media"
        type: string
      recordingsRetentionDays:
        description: Video recordings retention in days (1..365)
        type: integer
      snapshotsRetentionDays:
        description: Snapshot captures retention in days (1..730)
        type: integer
    type: object
  storage.StorageHealthStatus:
    enum:
    - healthy
    - warning
    - cleaning
    - emergency_stopped
    - error
    type: string
    x-enum-comments:
      StatusCleaning: Background cleaner is actively pruning expired/stale files
      StatusEmergencyStopped: Storage touched critical emergency line; writes suspended
      StatusError: Path missing, read-only, or external disk unmounted/fallen through
      StatusHealthy: Storage has plenty of space and read/write is normal
      StatusWarning: Storage usage touched high watermark threshold
    x-enum-descriptions:
    - Storage has plenty of space and read/write is normal
    - Storage usage touched high watermark threshold
    - Background cleaner is actively pruning expired/stale files
    - Storage touched critical emergency line; writes suspended
    - Path missing, read-only, or external disk unmounted/fallen through
    x-enum-varnames:
    - StatusHealthy
    - StatusWarning
    - StatusCleaning
    - StatusEmergencyStopped
    - StatusError
  storage.StorageStatus:
    properties:
      breakdown:
        allOf:
        - $ref: '#/definitions/storage.StorageUsageBreakdown'
        description: Categorized usage breakdown
      canWrite:
        description: True if storage is currently accepting new writes
        type: boolean
      deviceId:
        description: Associated filesystem device ID (st_dev)
        type: integer
      freeBytes:
        description: Available capacity for non-root users in bytes
        type: integer
      fsType:
        description: Filesystem type, e.g. "ext4", "xfs", "btrfs"
        type: string
      isExternal:
        description: True if mounted on dedicated volume outside rootfs (/)
        type: boolean
      mediaDirectory:
        description: Currently active media directory
        type: string
      mountPoint:
        description: Mount point where the media directory lives
        type: string
      status:
        allOf:
        - $ref: '#/definitions/storage.StorageHealthStatus'
        description: Current health status
      totalBytes:
        description: Total capacity in bytes
        type: integer
      updatedAt:
        description: Metric collection timestamp (UTC)
        type: string
      usagePercent:
        description: Volume usage percentage (0..100)
        type: integer
      usedBytes:
        description: Used capacity in bytes
        type: integer
    type: object
  storage.StorageUsageBreakdown:
    properties:
      exportsBytes:
        description: Total size of temporary exported files in bytes
        type: integer
      otherBytes:
        description: Other files residing on the same filesystem/volume
        type: integer
      recordingsBytes:
        description: Total size of video recordings in bytes
        type: integer
      snapshotsBytes:
        description: Total size of AI snapshots in bytes
        type: integer
    type: object
  storage.UpdateConfigRequest:
    properties:
      emergencyStopMinMb:
        maximum: 102400
        minimum: 100
        type: integer
      emergencyStopPercent:
        maximum: 99
        minimum: 90
        type: integer
      exportsRetentionHours:
        maximum: 168
        minimum: 1
        type: integer
      highWatermarkPercent:
        maximum: 95
        minimum: 50
        type: integer
      lowWatermarkPercent:
        maximum: 85
        minimum: 40
        type: integer
      mediaDirectory:
        type: string
      recordingsRetentionDays:
        maximum: 365
        minimum: 1
        type: integer
      snapshotsRetentionDays:
        maximum: 730
        minimum: 1
        type: integer
    required:
    - emergencyStopMinMb
    - emergencyStopPercent
    - exportsRetentionHours
    - highWatermarkPercent
    - lowWatermarkPercent
    - mediaDirectory
    - recordingsRetentionDays
    - snapshotsRetentionDays
    type: object
  systemtime.ManualTimeRequest:
    properties:
      targetTime:
        type: string
    required:
    - targetTime
    type: object
  systemtime.RtcStatus:
    enum:
    - normal
    - missing
    - error
    type: string
    x-enum-varnames:
    - RtcStatusNormal
    - RtcStatusMissing
    - RtcStatusError
  systemtime.SyncStatus:
    properties:
      errorMessage:
        type: string
      lastSyncServer:
        type: string
      lastSyncTime:
        type: string
      offsetMs:
        type: number
      rttMs:
        type: number
      state:
        type: string
    type: object
  systemtime.SystemTimeStatus:
    properties:
      currentTime:
        type: string
      hasPermission:
        type: boolean
      mode:
        type: string
      ntpServers:
        items:
          type: string
        type: array
      rtcStatus:
        $ref: '#/definitions/systemtime.RtcStatus'
      syncIntervalSeconds:
        type: integer
      syncStatus:
        $ref: '#/definitions/systemtime.SyncStatus'
      timezone:
        type: string
    type: object
  systemtime.UpdateConfigRequest:
    properties:
      mode:
        enum:
        - ntp
        - manual
        type: string
      ntpServers:
        items:
          type: string
        maxItems: 5
        minItems: 1
        type: array
      syncIntervalSeconds:
        maximum: 86400
        minimum: 60
        type: integer
      timezone:
        type: string
    required:
    - mode
    - ntpServers
    - syncIntervalSeconds
    - timezone
    type: object
info:
  contact: {}
  description: Local API for the Zhulong edge operations host.
  title: Zhulong API
  version: "1.0"
paths:
  /audit/logs:
    delete:
      parameters:
      - description: Clear logs older than this RFC3339 timestamp
        in: query
        name: before
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: Clear audit logs
      tags:
      - audit
    get:
      parameters:
      - description: Page number (1-based, default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      - description: Filter by one action (legacy parameter)
        in: query
        name: action
        type: string
      - collectionFormat: multi
        description: Filter by any matching action (repeat parameter for multiple
          values)
        in: query
        items:
          type: string
        name: actions
        type: array
      - description: Filter by status (success/failed)
        in: query
        name: status
        type: string
      - description: Start time (RFC3339)
        in: query
        name: startTime
        type: string
      - description: End time (RFC3339)
        in: query
        name: endTime
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/httputil.PaginatedData-audit_AuditLogDTO'
              type: object
      summary: List audit logs with filtering and pagination
      tags:
      - audit
  /auth/init:
    post:
      consumes:
      - application/json
      parameters:
      - description: Admin credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.InitAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.Response'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Initialize administrator account
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Response'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httputil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Login as administrator
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Logout administrator session
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get currently authenticated user
      tags:
      - auth
  /auth/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthStatusResponse'
              type: object
      summary: Get system initialization status
      tags:
      - auth
  /cameras:
    get:
      parameters:
      - description: Page number (1-based, default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      - description: Legacy pagination limit
        in: query
        name: limit
        type: integer
      - description: Legacy pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/httputil.PaginatedData-camera_CameraResponse'
              type: object
      summary: List cameras
      tags:
      - camera
    post:
      consumes:
      - application/json
      parameters:
      - description: Camera parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/camera.CreateCameraRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/camera.CameraResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Create a new camera
      tags:
      - camera
  /cameras/{id}:
    delete:
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  type: object
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Delete camera
      tags:
      - camera
    get:
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/camera.CameraResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get camera by ID
      tags:
      - camera
    put:
      consumes:
      - application/json
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/camera.UpdateCameraRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/camera.CameraResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Update camera configuration
      tags:
      - camera
  /cameras/{id}/credentials:
    get:
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/camera.CameraCredentialsResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get camera plaintext credentials
      tags:
      - camera
