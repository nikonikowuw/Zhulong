  /media/content/{path}:
    get:
      description: 'Streams the raw bytes of a media file with full RFC 7233 range
        support. The server performs byte transfer only: no decoding, demuxing, remuxing,
        transcoding or slicing. The successful response body is a raw byte stream,
        not the JSON envelope; error responses follow the standard envelope except
        for 416, which net/http writes as plain text.'
      parameters:
      - description: Media path relative to the media root
        in: path
        name: path
        required: true
        type: string
      - description: Byte range, e.g. bytes=0-1023
        in: header
        name: Range
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "206":
          description: Partial Content
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "416":
          description: Invalid range
          schema:
            type: string
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Stream media file bytes
      tags:
      - media
  /media/entries/{path}:
    get:
      description: Returns size and modification time for a single media file addressed
        by its path relative to the media root. The path must start with recordings,
        snapshots or exports. Absolute paths are rejected with 422 MEDIA_PATH_INVALID.
      parameters:
      - description: Media path relative to the media root, e.g. snapshots/cam-01/2026-10-13/evt-1.jpg
        in: path
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/mediafile.MediaEntry'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get media entry metadata
      tags:
      - media
  /media/roots:
    get:
      description: Reports media root availability, device identity, mount point and
