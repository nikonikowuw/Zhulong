  /system/storage/status:
    get:
      description: Retrieves disk capacity metrics, categorized usage breakdown, mount
        point, and current health status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/storage.StorageStatus'
              type: object
        "500":
          description: DATABASE_ERROR, STORAGE_TELEMETRY_UNAVAILABLE
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get media storage status and volume telemetry
      tags:
      - system
  /system/storage/test:
    post:
      consumes:
      - application/json
      description: Runs a write probe, filesystem detection, and volume identity check
        on a candidate path.
      parameters:
      - description: Target directory path to test
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/storage.PathTestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/storage.PathTestResponse'
              type: object
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: STORAGE_TELEMETRY_UNAVAILABLE
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Test candidate storage directory
      tags:
      - system
  /system/time:
    get:
      description: Retrieves current kernel time, active timezone, NTP candidate servers,
        synchronization state, and hardware RTC status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/systemtime.SystemTimeStatus'
              type: object
        "500":
          description: DATABASE_ERROR
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get system time status and clock health
      tags:
      - system
  /system/time/config:
    put:
      consumes:
      - application/json
      description: Updates synchronization mode (ntp/manual), NTP server pool, polling
        interval, and system IANA timezone.
      parameters:
      - description: Time configuration parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/systemtime.UpdateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/systemtime.SystemTimeStatus'
              type: object
        "422":
          description: VALIDATION_FAILED or INVALID_TIME_CONFIG
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: DATABASE_ERROR
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Update system time configuration
      tags:
      - system
  /system/time/manual:
    post:
      consumes:
      - application/json
      description: Explicitly sets kernel CLOCK_REALTIME and commits new time to hardware
        RTC chip.
      parameters:
      - description: Target ISO-8601 or RFC3339 timestamp
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/systemtime.ManualTimeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/systemtime.SystemTimeStatus'
              type: object
        "422":
          description: VALIDATION_FAILED or INVALID_TIMESTAMP
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: SET_TIME_FAILED
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Manually set system clock or synchronize browser time
      tags:
      - system
  /system/time/sync:
    post:
      description: Forces an immediate NTP query and clock alignment attempt against
        configured NTP server pool.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/systemtime.SystemTimeStatus'
              type: object
        "409":
          description: SYNC_IN_PROGRESS
          schema:
            $ref: '#/definitions/httputil.Response'
        "412":
          description: MANUAL_MODE_ACTIVE
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: DATABASE_ERROR
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Trigger immediate NTP synchronization
      tags:
      - system
  /tasks:
    get:
      description: Returns tasks filtered optionally by camera_id or algorithm_id.
      parameters:
      - description: Filter by camera ID
        in: query
        name: camera_id
        type: string
      - description: Filter by algorithm ID
        in: query
        name: algorithm_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/task.TaskResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: List analysis tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Binds a camera to algorithms with sampling rates and configuration
        JSON documents.
      parameters:
      - description: Analysis task payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/task.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/task.TaskResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Create an analysis task
      tags:
      - tasks
  /tasks/{id}:
    delete:
      parameters:
      - description: Analysis task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/task.DeleteTaskResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Delete an analysis task
      tags:
      - tasks
    get:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/task.TaskResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get single analysis task
      tags:
      - tasks
    put:
      consumes:
      - application/json
      description: Updates sampling rates, enabled state, or config JSON of an existing
        task.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/task.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/task.TaskResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Update an analysis task
      tags:
      - tasks
  /tasks/camera/{cameraId}:
    get:
      parameters:
      - description: Camera ID
        in: path
        name: cameraId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/task.TaskResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get channel analysis task by camera ID
      tags:
      - tasks
    put:
      consumes:
      - application/json
      parameters:
      - description: Camera ID
        in: path
        name: cameraId
        required: true
        type: string
      - description: Channel task payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/task.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/task.TaskResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Save channel analysis task by camera ID (Upsert)
      tags:
      - tasks
securityDefinitions:
  BearerAuth:
    description: Enter Bearer [token]
    in: header
    name: Authorization
    type: apiKey
