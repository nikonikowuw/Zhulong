  /gb28181/config:
    get:
      description: Returns the persisted GB28181 target configuration plus the configuration
        the running process actually loaded, its state and whether a restart is required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/gb28181.ConfigResponse'
              type: object
        "500":
          description: DATABASE_ERROR
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get GB28181 configuration
      tags:
      - gb28181
    put:
      consumes:
      - application/json
      description: Validates and atomically persists the GB28181 configuration. The
        running SIP listener is not reconfigured; the response reports restartRequired
        until the process is restarted. An empty mediaAdvertisedIp opts into single-address
        inference and assumes no NAT; NAT deployments must provide an explicit reachable
        address.
      parameters:
      - description: Complete target configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/gb28181.UpdateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/gb28181.ConfigResponse'
              type: object
        "422":
          description: VALIDATION_FAILED, GB28181_CONFIG_INVALID, GB28181_PORT_RANGE_INVALID,
            GB28181_ADDRESS_UNRESOLVABLE, GB28181_PROFILE_UNSUPPORTED, GB28181_REGISTERED_DEVICE_REQUIRED
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: DATABASE_ERROR, GB28181_ADDRESS_PROBE_FAILED
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Update GB28181 configuration
      tags:
      - gb28181
  /gb28181/devices:
    get:
