basePath: /api/v1
definitions:
  aitypes.FaceCandidate:
    properties:
      face_id:
        type: string
      person_id:
        type: string
      person_name:
        type: string
      similarity:
        type: number
    type: object
  algorithm.Algorithm:
    properties:
      category:
        type: string
      computeCost:
        type: integer
      configSchemaJson:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      manifestJson:
        type: string
      memoryMb:
        type: integer
      name:
        type: string
      previousVersion:
        type: string
      status:
        type: string
      targetArch:
        type: string
      targetDevice:
        type: string
      taskType:
        type: string
      updatedAt:
        type: string
      version:
        type: string
    type: object
  algorithm.DeletionImpact:
    properties:
      affectedCameraIds:
        description: AffectedCameraIDs 列出受影响相机，供前端直接展示「这 3 台相机会停」。
        items:
          type: string
        type: array
      alarmCount:
        type: integer
      algorithmId:
        type: string
      algorithmName:
        type: string
      boundTaskCount:
        description: |-
          BoundTaskCount 是当前绑定了该算法的通道任务数。卸载后这些任务的该算法条目
          会被删除；任务本身保留（其他算法不受影响），但若某任务因此变成空任务，
          那台相机就完全停止分析了。
        type: integer
      captureCount:
        type: integer
      recognitionCount:
        description: |-
          RecognitionCount / AlarmCount / CaptureCount 是历史证据条数。
          卸载**不会删除**它们，只会让 algorithm_id 变成 NULL。
          前端文案必须准确：是「失去归属」而非「删除」。
        type: integer
      requiresStop:
        description: RequiresStop 表示算法当前正在运行，卸载会先强制停止它。
        type: boolean
      status:
        type: string
      version:
        type: string
    type: object
  app.HealthData:
    properties:
      components:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
    type: object
  audithttp.AuditLogResponse:
    properties:
      action:
        type: string
      createdAt:
        type: string
      detail:
        type: string
      errorMsg:
        type: string
      id:
        type: integer
      ip:
        type: string
      status:
        type: string
      target:
        type: string
      username:
        type: string
    type: object
  auth.AuthStatusResponse:
    properties:
      initialized:
        type: boolean
    type: object
  auth.InitAdminRequest:
    properties:
      confirmPassword:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - confirmPassword
    - password
    - username
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.UserResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  camera.CameraCredentialsResponse:
    properties:
      cameraId:
        type: string
      credentials:
        additionalProperties:
          type: string
        description: role -> full plaintext RTSP URL
        type: object
    type: object
  camera.CameraResponse:
    properties:
      createdAt:
        type: string
      degraded:
        type: boolean
      enabled:
        type: boolean
      health:
        type: string
      id:
        type: string
      lastCheckedAt:
        type: string
      lastSuccessAt:
        type: string
      name:
        type: string
      reason:
        type: string
      revision:
        type: integer
      session:
        type: string
      stale:
        type: boolean
      streams:
        items:
          $ref: '#/definitions/camera.StreamResponse'
        type: array
      updatedAt:
        type: string
    type: object
  camera.CameraStateInfo:
    properties:
      cameraId:
        type: string
      degraded:
        type: boolean
      enabled:
        type: boolean
      health:
        type: string
      lastCheckedAt:
        type: string
      lastSuccessAt:
        type: string
      reason:
        type: string
      revision:
        type: integer
      session:
        type: string
      stale:
        type: boolean
      streams:
        additionalProperties:
          $ref: '#/definitions/camera.StreamStateInfo'
        type: object
    type: object
  camera.CreateCameraRequest:
    properties:
      enabled:
        type: boolean
      id:
        type: string
      mainStream:
        $ref: '#/definitions/camera.CreateStreamRequest'
      name:
        maxLength: 64
        minLength: 1
        type: string
      subStream:
        $ref: '#/definitions/camera.CreateStreamRequest'
    required:
    - mainStream
    - name
    type: object
  camera.CreateStreamRequest:
    properties:
      protocol:
        description: '"rtsp" (default)'
        type: string
      role:
        description: '"main" or "sub"'
        type: string
      rtspUrl:
        type: string
      transport:
        description: '"tcp" or "udp" (default "tcp")'
        type: string
    required:
    - rtspUrl
    type: object
  camera.DiagnoseResponse:
    properties:
      cameraId:
        type: string
      message:
        type: string
      state:
        $ref: '#/definitions/camera.CameraStateInfo'
    type: object
  camera.StreamResponse:
    properties:
      codec:
        type: string
      createdAt:
        type: string
      fps:
        type: number
      fpsString:
        type: string
      height:
        type: integer
      id:
        type: integer
      protocol:
        type: string
      role:
        type: string
      rtspUrl:
        description: Complete RTSP URL for frontend playback and display
        type: string
      runtimeState:
        $ref: '#/definitions/camera.StreamStateInfo'
      transport:
        type: string
      updatedAt:
        type: string
      width:
        type: integer
    type: object
  camera.StreamStateInfo:
    properties:
      consecutiveFailures:
        type: integer
      errorMessage:
        type: string
      evidenceType:
        type: string
      health:
        type: string
      lastCheckedAt:
        type: string
      lastSuccessAt:
        type: string
      reason:
        type: string
      role:
        type: string
      session:
        type: string
    type: object
  camera.UpdateCameraRequest:
    properties:
      enabled:
        type: boolean
      mainStream:
        $ref: '#/definitions/camera.CreateStreamRequest'
      name:
        maxLength: 64
        minLength: 1
        type: string
      revision:
        type: integer
      subStream:
        $ref: '#/definitions/camera.CreateStreamRequest'
    required:
    - revision
    type: object
  httputil.FieldDetail:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    required:
    - code
    - field
    - message
    type: object
  httputil.PaginatedData-audithttp_AuditLogResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/audithttp.AuditLogResponse'
        type: array
      limit:
        description: Backwards compatibility fields for legacy clients expecting limit/offset
        type: integer
      offset:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  httputil.PaginatedData-camera_CameraResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/camera.CameraResponse'
        type: array
      limit:
        description: Backwards compatibility fields for legacy clients expecting limit/offset
        type: integer
      offset:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  httputil.PaginatedData-person_FaceResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/person.FaceResponse'
        type: array
      limit:
        description: Backwards compatibility fields for legacy clients expecting limit/offset
        type: integer
      offset:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  httputil.PaginatedData-person_PersonResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/person.PersonResponse'
        type: array
      limit:
        description: Backwards compatibility fields for legacy clients expecting limit/offset
        type: integer
      offset:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  httputil.PaginatedData-record_AlarmResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/record.AlarmResponse'
        type: array
      limit:
        description: Backwards compatibility fields for legacy clients expecting limit/offset
        type: integer
      offset:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  httputil.PaginatedData-record_CaptureResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/record.CaptureResponse'
        type: array
      limit:
        description: Backwards compatibility fields for legacy clients expecting limit/offset
        type: integer
      offset:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  httputil.PaginatedData-record_RecognitionResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/record.RecognitionResponse'
        type: array
      limit:
        description: Backwards compatibility fields for legacy clients expecting limit/offset
        type: integer
      offset:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  httputil.Response:
    properties:
      code:
        type: string
      data: {}
      details:
        items:
          $ref: '#/definitions/httputil.FieldDetail'
        type: array
      message:
        type: string
    required:
    - code
    - data
    - message
    type: object
  mediafile.MediaDirectories:
    properties:
      exports:
        type: boolean
      recordings:
        type: boolean
      snapshots:
        type: boolean
    type: object
  mediafile.MediaEntry:
    properties:
      modifiedAt:
        description: ModifiedAt is the file modification time in UTC (RFC3339Nano).
        type: string
      name:
        description: Name is the final path element.
        type: string
      path:
        description: |-
          Path is the relative path inside the media root, using forward slashes
          and no leading slash. This is the same value persisted by the event
          domain, so it can round-trip back into the content endpoint.
        type: string
      sizeBytes:
        description: SizeBytes is the file length in bytes.
        type: integer
    type: object
  mediafile.MediaRootInfo:
    properties:
      available:
        type: boolean
      deviceId:
        type: integer
      directories:
        $ref: '#/definitions/mediafile.MediaDirectories'
      fsType:
        type: string
      isExternal:
        type: boolean
      isReadOnly:
        type: boolean
      mediaRoot:
        type: string
      mountPoint:
        type: string
      rootDeviceId:
        type: integer
    type: object
  network.ApplyResponse:
    properties:
      confirmToken:
        type: string
      targetUrl:
        type: string
      timeoutSec:
        type: integer
      transactionId:
        type: string
    type: object
  network.ConfirmRequest:
    properties:
      token:
        type: string
    type: object
  network.InterfaceConfig:
    properties:
      dns:
        description: DNS servers list
        items:
          type: string
        type: array
      gateway:
        description: Optional gateway address, e.g. "192.168.1.1"
        type: string
      ipAddress:
        description: Required when mode is "static", e.g. "192.168.1.100"
        type: string
      mode:
        enum:
        - dhcp
        - static
        type: string
      setDefault:
        description: Designate this interface as default gateway
        type: boolean
      subnetMask:
        description: Required when mode is "static", e.g. "255.255.255.0"
        type: string
    required:
    - mode
    type: object
  network.InterfaceInfo:
    properties:
      dns:
        description: Configured DNS servers
        items:
          type: string
        type: array
      gateway:
        description: Configured gateway address, or empty
        type: string
      ipAddresses:
        description: Assigned IPv4 addresses with CIDR prefix, e.g. ["192.168.1.100/24"]
        items:
          type: string
        type: array
      isCurrent:
        description: True only when the current HTTP request maps unambiguously to
          this interface
        type: boolean
      isDefaultGw:
        description: True if interface hosts default route (0.0.0.0/0)
        type: boolean
      linkUp:
        description: Carrier status (cable plugged in)
        type: boolean
      mac:
        description: Physical MAC address, e.g. "52:54:00:12:34:56"
        type: string
      mode:
        description: '"dhcp" or "static"'
        type: string
      name:
        description: Interface identifier, e.g. "eth0"
        type: string
    type: object
  network.PingRequest:
    properties:
      target:
        type: string
    required:
    - target
    type: object
  network.PingResponse:
    properties:
      reachable:
        type: boolean
      rttMs:
        type: number
    type: object
  network.RollbackRequest:
    properties:
      token:
        type: string
    type: object
  network.TransactionState:
    properties:
      confirmToken:
        type: string
      expiresAt:
        type: string
      interfaceName:
        type: string
      rollbackConfig:
        $ref: '#/definitions/network.InterfaceConfig'
      status:
        description: '"idle", "pending_confirm", "rolling_back"'
        type: string
      targetUrl:
        type: string
      timeoutSec:
        type: integer
      transactionId:
        type: string
    type: object
  person.CreatePersonRequest:
    properties:
      name:
        maxLength: 64
        minLength: 1
        type: string
      personId:
        description: |-
          PersonID is the external business key. It is optional: if omitted or empty,
          it is left unset (NULL) without falling back to the internal primary key.
        maxLength: 64
        type: string
    required:
    - name
    type: object
  person.FaceResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      imagePath:
        type: string
      ownerRowId:
        type: string
    type: object
  person.PersonResponse:
    properties:
      createdAt:
        type: string
      faces:
        items:
          $ref: '#/definitions/person.FaceResponse'
        type: array
      id:
        type: string
      name:
        type: string
      personId:
        type: string
      primaryFaceId:
        type: string
      updatedAt:
        type: string
    type: object
  person.SetPrimaryFaceRequest:
    properties:
      faceId:
        type: string
    required:
    - faceId
    type: object
  person.UpdatePersonRequest:
    properties:
      name:
        description: |-
          Name is a pointer so that "not provided" (nil) stays distinguishable from
          "provided": an explicitly empty name must be rejected rather than ignored.
        maxLength: 64
        minLength: 1
        type: string
      personId:
        description: |-
          PersonID is accepted only so that an attempt to change it fails loudly instead
          of being silently dropped by the JSON decoder. Supplying a different value is
          rejected with PERSON_ID_IMMUTABLE.
        maxLength: 64
        type: string
    type: object
  record.AlarmResponse:
    properties:
      alarmType:
        type: string
      algorithmId:
        type: string
      algorithmName:
        description: 同 RecognitionResponse：算法卸载后的来源凭证。
        type: string
      algorithmVersion:
        type: string
      box:
        items:
          type: number
        type: array
      cameraId:
        type: string
      capturedAt:
        type: string
      createdAt:
        type: string
      cropPath:
        type: string
      extra:
        additionalProperties: {}
        type: object
      id:
        type: string
      imagePath:
        type: string
      pts:
        type: integer
      score:
        type: number
    type: object
  record.CaptureResponse:
    properties:
      algorithmId:
        description: |-
          与 RecognitionResponse / AlarmResponse 同构：算法卸载后 ID 变空，
          名称与版本快照仍能回答「这张抓拍是哪个算法产生的」。
        type: string
      algorithmName:
        type: string
      algorithmVersion:
        type: string
      attributes:
        additionalProperties: {}
        type: object
      box:
        items:
          type: number
        type: array
      cameraId:
        type: string
      capturedAt:
        type: string
      createdAt:
        type: string
      cropPath:
        type: string
      id:
        type: string
      imagePath:
        type: string
      pts:
        type: integer
      score:
        type: number
      targetType:
        type: string
      trackId:
        type: integer
    type: object
  record.RecognitionResponse:
    properties:
      algorithmId:
        type: string
      algorithmName:
        description: |-
          AlgorithmName/Version 来自写入时快照：算法被卸载后 algorithmId 变空，
          但这两个字段仍能回答「这批记录是哪个算法产生的」。
        type: string
      algorithmVersion:
        type: string
      attributes:
        additionalProperties: {}
        type: object
      bodyBox:
        items:
          type: number
        type: array
      box:
        items:
          type: number
        type: array
      cameraId:
        type: string
      candidates:
        items:
          $ref: '#/definitions/aitypes.FaceCandidate'
        type: array
      capturedAt:
        type: string
      createdAt:
        type: string
      faceImagePath:
        type: string
      galleryImagePath:
        type: string
      id:
        type: string
      imagePath:
        type: string
      matched:
        type: boolean
      matchedFaceId:
        type: string
      personId:
        type: string
      personName:
        type: string
      pts:
        type: integer
      similarity:
        type: number
      trackId:
        type: integer
    type: object
  storage.CleanupSummary:
    properties:
      deletedFiles:
        type: integer
      durationMs:
        type: integer
      finishedAt:
        type: string
      freedBytes:
        type: integer
      targetStatus:
        type: string
      triggerReason:
        description: '"watermark", "scheduled", "manual"'
        type: string
    type: object
  storage.PathTestRequest:
    properties:
      path:
        type: string
    required:
    - path
    type: object
  storage.PathTestResponse:
    properties:
      deviceId:
        type: integer
      errorReason:
        type: string
      exists:
        type: boolean
      freeBytes:
        type: integer
      fsType:
        type: string
      isExternal:
        type: boolean
      isMount:
        type: boolean
      mountPoint:
        type: string
      path:
        type: string
      totalBytes:
        type: integer
      writable:
        type: boolean
    type: object
  storage.StorageConfig:
    properties:
      emergencyStopMinMb:
        description: Emergency minimum free space in megabytes (100..102400)
        type: integer
      emergencyStopPercent:
        description: Emergency write-stop percentage (90..99)
        type: integer
      exportsRetentionHours:
        description: Exported clips retention in hours (1..168)
        type: integer
      highWatermarkPercent:
        description: High watermark percentage triggering cleaner (50..95)
        type: integer
      lowWatermarkPercent:
        description: Low watermark percentage where cleaner sleeps (40..85)
        type: integer
      mediaDirectory:
        description: Root media path, e.g. "/mnt/storage/media"
        type: string
      recordingsRetentionDays:
        description: Video recordings retention in days (1..365)
        type: integer
      snapshotsRetentionDays:
        description: Snapshot captures retention in days (1..730)
        type: integer
    type: object
  storage.StorageHealthStatus:
    enum:
    - healthy
    - warning
    - cleaning
    - emergency_stopped
    - error
    type: string
    x-enum-comments:
      StatusCleaning: Background cleaner is actively pruning expired/stale files
      StatusEmergencyStopped: Storage touched critical emergency line; writes suspended
      StatusError: Path missing, read-only, or external disk unmounted/fallen through
      StatusHealthy: Storage has plenty of space and read/write is normal
      StatusWarning: Storage usage touched high watermark threshold
    x-enum-descriptions:
    - Storage has plenty of space and read/write is normal
    - Storage usage touched high watermark threshold
    - Background cleaner is actively pruning expired/stale files
    - Storage touched critical emergency line; writes suspended
    - Path missing, read-only, or external disk unmounted/fallen through
    x-enum-varnames:
    - StatusHealthy
    - StatusWarning
    - StatusCleaning
    - StatusEmergencyStopped
    - StatusError
  storage.StorageStatus:
    properties:
      breakdown:
        allOf:
        - $ref: '#/definitions/storage.StorageUsageBreakdown'
        description: Categorized usage breakdown
      canWrite:
        description: True if storage is currently accepting new writes
        type: boolean
      deviceId:
        description: Associated filesystem device ID (st_dev)
        type: integer
      freeBytes:
        description: Available capacity for non-root users in bytes
        type: integer
      fsType:
        description: Filesystem type, e.g. "ext4", "xfs", "btrfs"
        type: string
      isExternal:
        description: True if mounted on dedicated volume outside rootfs (/)
        type: boolean
      mediaDirectory:
        description: Currently active media directory
        type: string
      mountPoint:
        description: Mount point where the media directory lives
        type: string
      status:
        allOf:
        - $ref: '#/definitions/storage.StorageHealthStatus'
        description: Current health status
      totalBytes:
        description: Total capacity in bytes
        type: integer
      updatedAt:
        description: Metric collection timestamp (UTC)
        type: string
      usagePercent:
        description: Volume usage percentage (0..100)
        type: integer
      usedBytes:
        description: Used capacity in bytes
        type: integer
    type: object
  storage.StorageUsageBreakdown:
    properties:
      exportsBytes:
        description: Total size of temporary exported files in bytes
        type: integer
      otherBytes:
        description: Other files residing on the same filesystem/volume
        type: integer
      recordingsBytes:
        description: Total size of video recordings in bytes
        type: integer
      snapshotsBytes:
        description: Total size of AI snapshots in bytes
        type: integer
    type: object
  storage.UpdateConfigRequest:
    properties:
      emergencyStopMinMb:
        maximum: 102400
        minimum: 100
        type: integer
      emergencyStopPercent:
        maximum: 99
        minimum: 90
        type: integer
      exportsRetentionHours:
        maximum: 168
        minimum: 1
        type: integer
      highWatermarkPercent:
        maximum: 95
        minimum: 50
        type: integer
      lowWatermarkPercent:
        maximum: 85
        minimum: 40
        type: integer
      mediaDirectory:
        type: string
      recordingsRetentionDays:
        maximum: 365
        minimum: 1
        type: integer
      snapshotsRetentionDays:
        maximum: 730
        minimum: 1
        type: integer
    required:
    - emergencyStopMinMb
    - emergencyStopPercent
    - exportsRetentionHours
    - highWatermarkPercent
    - lowWatermarkPercent
    - mediaDirectory
    - recordingsRetentionDays
    - snapshotsRetentionDays
    type: object
  systemtime.ManualTimeRequest:
    properties:
      targetTime:
        type: string
    required:
    - targetTime
    type: object
  systemtime.RtcStatus:
    enum:
    - normal
    - missing
    - error
    type: string
    x-enum-varnames:
    - RtcStatusNormal
    - RtcStatusMissing
    - RtcStatusError
  systemtime.SyncStatus:
    properties:
      errorMessage:
        type: string
      lastSyncServer:
        type: string
      lastSyncTime:
        type: string
      offsetMs:
        type: number
      rttMs:
        type: number
      state:
        type: string
    type: object
  systemtime.SystemTimeStatus:
    properties:
      currentTime:
        type: string
      hasPermission:
        type: boolean
      mode:
        type: string
      ntpServers:
        items:
          type: string
        type: array
      rtcStatus:
        $ref: '#/definitions/systemtime.RtcStatus'
      syncIntervalSeconds:
        type: integer
      syncStatus:
        $ref: '#/definitions/systemtime.SyncStatus'
      timezone:
        type: string
    type: object
