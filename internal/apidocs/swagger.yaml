  /gb28181/devices/{deviceId}:
    delete:
      description: Deletes a pre-provisioned GB28181 device. If any of its channels
        are bound to a camera, deletion is rejected until the camera is unbound or
        deleted.
      parameters:
      - description: 20-digit device ID
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputil.Response'
        "404":
          description: GB28181_DEVICE_NOT_FOUND
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: GB28181_CAMERA_BOUND
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Delete GB28181 device
      tags:
      - gb28181
    put:
      consumes:
      - application/json
      description: Adds a device to the registration allowlist or updates its metadata
        and Digest password. Omitting password keeps the stored credential. The password
        is encrypted before storage and is never returned.
      parameters:
      - description: 20-digit GB28181 device identity
        in: path
        name: deviceId
        required: true
        type: string
      - description: Device metadata and optional password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/gb28181.UpsertDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/gb28181.DeviceResponse'
              type: object
        "422":
          description: VALIDATION_FAILED, GB28181_DEVICE_ID_INVALID, GB28181_TRANSPORT_INVALID,
            GB28181_PASSWORD_REQUIRED
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: DATABASE_ERROR, GB28181_RUNTIME_NOT_READY
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Provision or update a GB28181 device
      tags:
      - gb28181
  /gb28181/devices/{deviceId}/catalog:
    post:
      description: 'Sends a SIP Catalog query to an online GB28181 device, reassembles
        the channel fragments, and reconciles the local catalog: channels the device
        no longer reports are removed unless a camera is still bound to them.'
      parameters:
      - description: 20-digit device ID
        in: path
