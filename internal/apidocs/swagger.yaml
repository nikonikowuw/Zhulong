      cachedBytes:
        type: integer
      freeBytes:
        type: integer
      swapTotalBytes:
        type: integer
      swapUsedBytes:
        type: integer
      swapUsedPercent:
        type: number
      totalBytes:
        type: integer
      usedBytes:
        type: integer
      usedPercent:
        type: number
    type: object
  systeminfo.NPUStatus:
    properties:
      coreLoads:
        items:
          type: number
        type: array
      loadPercent:
        type: number
      name:
        type: string
      supported:
        type: boolean
      temperature:
        type: number
    type: object
  systeminfo.NetworkInterfaceStatus:
    properties:
      interface:
        type: string
      isUp:
        type: boolean
      rxBytesRate:
        type: integer
      rxTotalBytes:
        type: integer
      txBytesRate:
        type: integer
      txTotalBytes:
        type: integer
    type: object
  systeminfo.StorageMountStatus:
    properties:
      device:
        type: string
      freeBytes:
        type: integer
      fsType:
        type: string
      mountPoint:
        type: string
      totalBytes:
        type: integer
      usedBytes:
        type: integer
      usedPercent:
        type: number
    type: object
  systeminfo.SystemHardwareResponse:
    properties:
      cpu:
        $ref: '#/definitions/systeminfo.CPUStatus'
      heterogeneous:
        $ref: '#/definitions/systeminfo.HeterogeneousStatus'
      history:
        items:
          $ref: '#/definitions/systeminfo.HardwareHistoryPoint'
        type: array
      host:
        $ref: '#/definitions/systeminfo.HostInfo'
      memory:
        $ref: '#/definitions/systeminfo.MemoryStatus'
      network:
        items:
          $ref: '#/definitions/systeminfo.NetworkInterfaceStatus'
        type: array
      storage:
        items:
          $ref: '#/definitions/systeminfo.StorageMountStatus'
        type: array
      updatedAt:
        type: string
    type: object
  systeminfo.SystemIdentityResponse:
    properties:
      autoGenerated:
        description: |-
          AutoGenerated reports that the current value is the fallback this host
          generated on first boot, not a name an operator chose.
        type: boolean
      deviceId:
        type: string
      updatedAt:
        type: string
    type: object
  systeminfo.TemperatureInfo:
    properties:
      label:
        type: string
      temperature:
        type: number
    type: object
  systeminfo.UpdateSystemIdentityRequest:
    properties:
      deviceId:
        type: string
    required:
    - deviceId
    type: object
  systemtime.ManualTimeRequest:
    properties:
      targetTime:
        type: string
    required:
    - targetTime
    type: object
  systemtime.RTCStatus:
    enum:
    - normal
    - missing
    - error
    type: string
    x-enum-varnames:
    - RTCStatusNormal
    - RTCStatusMissing
    - RTCStatusError
  systemtime.SyncStatus:
    properties:
      errorMessage:
        type: string
      lastSyncServer:
        type: string
      lastSyncTime:
        type: string
      offsetMs:
        type: number
      rttMs:
        type: number
      state:
        type: string
    type: object
  systemtime.SystemTimeStatus:
    properties:
      currentTime:
        type: string
      hasPermission:
        type: boolean
      mode:
        type: string
      ntpServers:
        items:
          type: string
        type: array
      rtcStatus:
        $ref: '#/definitions/systemtime.RTCStatus'
      syncIntervalSeconds:
        type: integer
      syncStatus:
        $ref: '#/definitions/systemtime.SyncStatus'
      timezone:
        type: string
    type: object
  systemtime.UpdateConfigRequest:
    properties:
      mode:
        enum:
        - ntp
        - manual
        type: string
      ntpServers:
        items:
          type: string
        maxItems: 5
        minItems: 1
        type: array
      syncIntervalSeconds:
        maximum: 86400
        minimum: 60
        type: integer
      timezone:
        type: string
    required:
    - mode
    - ntpServers
    - syncIntervalSeconds
    - timezone
    type: object
  task.CreateTaskRequest:
    properties:
      algorithm_id:
        type: string
      algorithmId:
        description: Legacy single-algorithm fields for backward compatibility
        type: string
      algorithms:
        items:
          $ref: '#/definitions/task.TaskAlgorithmItem'
        type: array
      camera_id:
        type: string
      cameraId:
        type: string
      config_json:
        type: string
      configJson:
        type: string
      crop:
        items:
          type: number
        type: array
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      region_config_json:
        type: string
      regionConfigJson:
        type: string
      sample_fps:
        type: integer
      sampleFps:
        type: integer
    type: object
  task.DeleteTaskResponse:
    properties:
      deleted:
        type: boolean
    type: object
  task.TaskAlgorithmInfo:
    properties:
      algorithmId:
        type: string
      configJson:
        type: string
      createdAt:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      regionConfigJson:
        type: string
      sampleFps:
        type: integer
      scheduleJson:
        type: string
      taskId:
        type: string
      updatedAt:
        type: string
    type: object
  task.TaskAlgorithmItem:
    properties:
      algorithm_id:
        type: string
      algorithmId:
        type: string
      config_json:
        type: string
      configJson:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      region_config_json:
        type: string
      regionConfigJson:
        type: string
      sample_fps:
        type: integer
      sampleFps:
        type: integer
      schedule_json:
        type: string
      scheduleJson:
        type: string
    type: object
  task.TaskResponse:
    properties:
      algorithms:
        items:
          $ref: '#/definitions/task.TaskAlgorithmInfo'
        type: array
      cameraId:
        type: string
      createdAt:
        type: string
      crop:
        description: Crop 是任务级前置裁剪窗口；null 表示不裁剪。
        items:
          type: number
        type: array
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  task.UpdateTaskRequest:
    properties:
      algorithms:
        items:
          $ref: '#/definitions/task.TaskAlgorithmItem'
        type: array
      config_json:
        type: string
      configJson:
        type: string
      crop:
        description: |-
          Crop 是三态合并字段：省略=不改、null/[]/{}=清除、[x1,y1,x2,y2]=设置。

          用 json.RawMessage 而不是 *region.Rect：后者无法区分“字段缺省”与“显式 null”，
          而 PUT /tasks/:id 的合并语义必须区分这两者（缺省不得清空已保存的裁剪）。
        items:
          type: number
        type: array
      enabled:
        type: boolean
      name:
        type: string
      region_config_json:
        type: string
      regionConfigJson:
        type: string
      sample_fps:
        type: integer
      sampleFps:
        description: Legacy single-algorithm update fields
        type: integer
    type: object
info:
  contact: {}
  description: Local API for the Zhulong edge operations host.
  title: Zhulong API
  version: "1.0"
paths:
  /alert-destinations:
    get:
      description: Returns list of configured alert push destinations with real-time
        operational status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/alertpush.AlertDestinationListResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: List alert destinations
      tags:
      - alertpush
    post:
      consumes:
      - application/json
      description: Creates a new webhook or mqtt alert destination.
      parameters:
      - description: Destination configuration
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/alertpush.CreateAlertDestinationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/alertpush.AlertDestinationResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Create alert destination
      tags:
      - alertpush
  /alert-destinations/{id}:
    delete:
      description: Removes an alert destination by ID.
      parameters:
      - description: Destination ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Delete alert destination
      tags:
      - alertpush
    put:
      consumes:
      - application/json
      description: Updates an existing destination configuration.
      parameters:
      - description: Destination ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/alertpush.UpdateAlertDestinationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/alertpush.AlertDestinationResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Update alert destination
      tags:
      - alertpush
  /alert-destinations/{id}/disable:
    post:
      description: Disables an alert destination.
      parameters:
      - description: Destination ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/alertpush.AlertDestinationResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Disable alert destination
      tags:
      - alertpush
  /alert-destinations/{id}/enable:
    post:
      description: Enables an alert destination.
      parameters:
      - description: Destination ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/alertpush.AlertDestinationResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Enable alert destination
      tags:
      - alertpush
  /alert-destinations/test:
    post:
      consumes:
      - application/json
      description: Validates connectivity for draft or saved destinations.
      parameters:
      - description: Test parameters
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/alertpush.TestAlertDestinationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/alertpush.TestAlertDestinationResponse'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Test alert destination connectivity
      tags:
      - alertpush
  /algorithms:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/algorithm.AlgorithmResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: List registered algorithms
      tags:
      - algorithm
  /algorithms/{id}:
    delete:
      description: Removes the algorithm registration and its installed files. Deleting
        an algorithm that is currently ACTIVE returns 409 ALGORITHM_IS_ACTIVE; disable
        it first.
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.AlgorithmDeleteResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Delete an algorithm
      tags:
      - algorithm
    get:
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.AlgorithmResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Get algorithm details by ID
      tags:
      - algorithm
  /algorithms/{id}/deletion-impact:
    get:
      description: 'Returns how many tasks, cameras and evidence records reference
        this algorithm. Read-only: it has no side effects and can be called freely
        before asking the operator to confirm. Note that deleting an algorithm does
        NOT delete evidence records — it only clears their algorithm reference, so
        `algorithmId` becomes empty while the `algorithmName` / `algorithmVersion`
        snapshots remain.'
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.DeletionImpact'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Preview the impact of deleting an algorithm
      tags:
      - algorithm
  /algorithms/{id}/disable:
    post:
      description: Stops the supervised runner subprocess and sets the algorithm status
        to DISABLED.
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.AlgorithmStatusResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Disable an algorithm and stop its runner process
      tags:
      - algorithm
  /algorithms/{id}/enable:
    post:
      description: Starts the supervised runner subprocess and sets the algorithm
        status to ACTIVE. The runner is monitored and restarted according to the recovery
        policy until the crash-loop threshold is reached.
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.AlgorithmStatusResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Enable an algorithm and start its runner process
      tags:
      - algorithm
  /algorithms/{id}/reset:
    post:
      description: Clears the crash-loop circuit breaker and returns the algorithm
        to DISABLED so it can be enabled again. Returns 409 ALGORITHM_NOT_IN_CRASH_LOOP
        when the algorithm is not currently in CRASH_LOOP.
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.AlgorithmStatusResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Reset an algorithm stuck in CRASH_LOOP
      tags:
      - algorithm
  /algorithms/{id}/trial:
    post:
      consumes:
      - multipart/form-data
      description: Performs a one-shot inference using an uploaded static image against
        an installed, disabled algorithm. Returns structured detection/classification/structure
        results with bounding boxes and execution duration.
      parameters:
      - description: Algorithm ID
        in: path
        name: id
        required: true
        type: string
      - description: Static image (JPEG/PNG, at most 10 MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.AlgorithmTrialResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Run trial inference with a static image
      tags:
      - algorithm
  /algorithms/install:
    post:
      consumes:
      - multipart/form-data
      description: Streams a multipart archive to a temporary file, then verifies
        platform target, resource budget, sample inference and config schema before
        registering the algorithm. Rejects platform mismatch, unsupported archive
        formats, zip-slip paths, decompression bombs, invalid manifest tokens and
        already installed versions.
      parameters:
      - description: Algorithm package archive (at most 500 MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/algorithm.AlgorithmResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Install an algorithm package
      tags:
      - algorithm
  /api-tokens:
    get:
      description: List active API tokens (and optionally revoked tokens).
      parameters:
      - description: Include revoked tokens
        in: query
        name: includeRevoked
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/apitoken.APITokenListResponse'
              type: object
      summary: List API tokens
      tags:
      - apitoken
    post:
      consumes:
      - application/json
      description: Create a new API token. The plaintext token is returned only once.
      parameters:
      - description: Token creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apitoken.CreateAPITokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/apitoken.APITokenCreateResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Create API token
      tags:
      - apitoken
  /api-tokens/{id}:
    delete:
      description: Soft-delete an API token by ID. Revoked tokens immediately stop
        working.
      parameters:
      - description: API token ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/apitoken.APITokenRevokeResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.Response'
      summary: Revoke API token
      tags:
      - apitoken
  /audit/logs:
    delete:
      parameters:
      - description: Clear logs older than this RFC3339 timestamp
        in: query
        name: before
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: Clear audit logs
      tags:
      - audit
    get:
      parameters:
      - description: Page number (1-based, default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      - description: Filter by one action (legacy parameter)
        in: query
        name: action
        type: string
      - collectionFormat: multi
        description: Filter by any matching action (repeat for more)
        in: query
        items:
          type: string
        name: actions
        type: array
      - description: Filter by status (success/failed)
        in: query
        name: status
        type: string
      - description: Start time (RFC3339)
        in: query
        name: startTime
        type: string
      - description: End time (RFC3339)
        in: query
        name: endTime
        type: string
      produces:
      - application/json
      responses:
        "200":
