        by its path relative to the media root. The path must start with recordings,
        snapshots or exports. Absolute paths are rejected with 422 MEDIA_PATH_INVALID.
      parameters:
      - description: Media path relative to the media root, e.g. snapshots/cam-01/2026-10-13/evt-1.jpg
        in: path
