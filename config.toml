# Zhulong runtime configuration.
# The service reads this file from its working directory at startup.

[http]
address = "127.0.0.1:8000"
# TLS mode: "off" (plain HTTP, default), "auto" (self-signed cert with local/LAN SANs for WebCodecs), or "manual".
tls_mode = "off"
# Manual certificate paths (used when tls_mode = "manual")
cert_file = ""
key_file = ""

[logging]
# Runtime level: debug | info | warn | error. SIGHUP re-reads this key in place, so
# it must stay present here: a missing key makes the reload a no-op that keeps the
# active level (the reload never falls back to a default).
level = "info"
# Omitted policy values default to info/json/stderr with sampling and rotation disabled.
# File output must explicitly enable bounded rotation and set a reviewed total-size budget.

# Data directory for SQLite (zhulong.db), persistent keys (camera.key), and algorithms.
# Defaults to "./data" in the project directory.
# For production edge Linux deployment (e.g. RK3588 / Atlas), change to a persistent path like "/var/lib/zhulong" or "/data".
[data]
directory = "./data"

# Personnel management and face gallery configuration.
[person]
# Directory for enrolled face template photos.
# Defaults to "<data.directory>/faces" if omitted or left empty.
faces_directory = ""
# Refuse face enrollment for a person that has no personId yet.
# Enable this when recognitions are reported to an external business system: a face
# whose owner has no business key can only ever produce an unreportable record, so the
# refusal happens at enrollment instead of surfacing later as undeliverable evidence.
require_person_id_for_face_enrollment = false
# Algorithm package that provides face feature extraction for gallery enrollment.
# It is resolved per request (active version + package entry), so upgrading or
# reinstalling the package needs no change here. Must be an installed package id.
extractor_algorithm = "face_recognition"

# Must match manifest.json platform.target for algorithm packages.
[algorithm]
target = "onnx"

# Authentication and session security configuration.
[auth]
# Session idle timeout duration. Supports Go duration syntax (e.g. "30m", "12h", "24h", "7d").
# Automatically extended on user activity (sliding expiration).
# Defaults to "24h".
session_ttl = "24h"

# Hardware video decoding policy and admission control.
[decode]
backend = "auto"                 # "auto" | "mpp" | "ffmpeg"
allow_software_fallback = true   # Board deployment profiles must set false (fail-closed)
max_sessions = 8                 # Maximum concurrent physical decode streams (0 = no limit)


